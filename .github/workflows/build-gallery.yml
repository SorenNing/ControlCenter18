name: Build C18GalleryCN arm64e
on:
  push:
    branches: [ 'c18g' ]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid || true
      - run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -c -fobjc-arc -target arm64-apple-ios15.0 -arch arm64e -isysroot "$SDK" \
                c18g/C18GalleryCN.m -o C18GalleryCN.o
          ld -arch arm64e -dylib -platform_version ios 15.0 16.5 -syslibroot "$SDK" \
             -install_name /Library/MobileSubstrate/DynamicLibraries/C18GalleryCN.dylib \
             -undefined dynamic_lookup -no_implicit_dylibs -ignore_auto_link -dead_strip -fixup_chains \
             C18GalleryCN.o -lobjc -lSystem -o C18GalleryCN.dylib
          ldid -S -Cadhoc C18GalleryCN.dylib
          file C18GalleryCN.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: C18GalleryCN-arm64e
          path: C18GalleryCN.dylib
