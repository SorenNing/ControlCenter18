name: Build C18OwnerRow arm64e
on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install ldid || true
      - run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          clang -c -fobjc-arc -target arm64-apple-ios15.0 -isysroot "$SDK" \
                C18OwnerRow.m -o C18OwnerRow.o
          ld -arch arm64e -dylib -platform_version ios 15.0 16.5 -syslibroot "$SDK" \
             -install_name /Library/MobileSubstrate/DynamicLibraries/C18OwnerRow.dylib \
             -undefined dynamic_lookup -no_implicit_dylibs -ignore_auto_link -dead_strip -fixup_chains \
             C18OwnerRow.o -lobjc -lSystem -o C18OwnerRow.dylib
          ldid -S -Cadhoc C18OwnerRow.dylib
          file C18OwnerRow.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: C18OwnerRow-arm64e
          path: C18OwnerRow.dylib
